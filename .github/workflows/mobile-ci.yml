name: Mobile CI

on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']

jobs:
  test:
    name: Lint · Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

  build-apk:
    name: Build APK (release)
    runs-on: ubuntu-latest
    needs: test
    # Ne tourne que sur push vers main (après merge), pas sur PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project (Expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Configure release signing
        working-directory: mobile/android
        run: sed -i 's/release {/release {\n            signingConfig signingConfigs.debug/' app/build.gradle

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
