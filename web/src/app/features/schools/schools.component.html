<app-admin-layout
  [pageTitle]="i18n.schools.title"
  [pageSubtitle]="i18n.schools.subtitle"
>
  <div class="schools-page">
    <!-- 4 Cartes de statistiques -->
    <section class="stats-grid">
      <app-stat-card
        [label]="i18n.schools.stats.schoolsActive"
        [value]="stats()?.schools?.active"
        [subtext]="stats() ? ('sur ' + stats()!.schools.total + ' écoles au total') : ''"
        icon="school"
        trendText="+80% ce mois"
        [loading]="loadingStats()"
      ></app-stat-card>

      <app-stat-card
        [label]="i18n.schools.stats.programsActive"
        [value]="stats()?.programs?.active"
        [subtext]="stats() ? ('sur ' + stats()!.programs.total + ' filières au total') : ''"
        icon="program"
        trendText="+80% ce mois"
        [loading]="loadingStats()"
      ></app-stat-card>

      <app-stat-card
        [label]="i18n.schools.stats.usersActive"
        [value]="stats()?.users?.active"
        [subtext]="stats() ? ('sur ' + stats()!.users.total + ' utilisateurs au total') : ''"
        icon="user"
        trendText="+80% ce mois"
        [loading]="loadingStats()"
      ></app-stat-card>

      <app-stat-card
        [label]="i18n.schools.stats.spacesActive"
        [value]="stats()?.institutionalSpaces?.active"
        [subtext]="stats() ? ('sur ' + stats()!.institutionalSpaces.total + ' espaces au total') : ''"
        icon="space"
        trendText="-70% ce mois"
        [loading]="loadingStats()"
      ></app-stat-card>
    </section>

    <!-- Bandeau d'erreur éventuel -->
    @if (errorSchools()) {
      <app-error-banner
        [message]="i18n.common.errorNetwork"
        (retry)="loadSchools()"
      ></app-error-banner>
    }

    <!-- Barre de filtres et action Nouvelle école -->
    <section class="filters-action-bar">
      <div class="filters-left">
        <div class="filter-search-box">
          <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
          </svg>
          <input
            type="text"
            [placeholder]="i18n.schools.filters.searchPlaceholder"
            [ngModel]="searchTerm()"
            (ngModelChange)="onSearchInput($event)"
          />
        </div>

        <div class="filter-selects">
          <!-- Filtre Type -->
          <div class="select-wrapper">
            <select
              class="filter-select"
              [ngModel]="selectedType()"
              (ngModelChange)="onTypeChange($event)"
            >
              <option value="">{{ i18n.schools.filters.allTypes }}</option>
              <option value="public">{{ i18n.type.public }}</option>
              <option value="private">{{ i18n.type.private }}</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </div>

          <!-- Filtre Statut -->
          <div class="select-wrapper">
            <select
              class="filter-select"
              [ngModel]="selectedStatus()"
              (ngModelChange)="onStatusChange($event)"
            >
              <option value="">{{ i18n.schools.filters.allStatuses }}</option>
              <option value="active">{{ i18n.status.active }}</option>
              <option value="inactive">{{ i18n.status.inactive }}</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </div>

          @if (hasActiveFilters) {
            <button class="btn-text-reset" (click)="resetFilters()">
              {{ i18n.schools.filters.resetFilters }}
            </button>
          }
        </div>
      </div>

      <div class="filters-right">
        @if (canManageSchools) {
          <button class="btn btn-primary btn-add" (click)="openCreateSchool()">
            <svg viewBox="0 0 20 20" fill="currentColor" class="plus-icon">
              <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            {{ i18n.schools.newSchoolBtn }}
          </button>
        }
      </div>
    </section>

    <!-- Tableau des écoles -->
    <app-data-table
      [columns]="columns"
      [data]="schools()"
      [meta]="meta()"
      [loading]="loadingSchools()"
      [clickable]="true"
      [selectable]="true"
      [hasEmptyStateContent]="true"
      (rowClick)="openDetail($event)"
      (pageChange)="onPageChange($event)"
    >
      <!-- Template Personnalisé Colonne Nom -->
      <ng-template #cellName let-school>
        <div class="school-name-cell">
          <div class="building-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M3 21h18M3 7v14M21 7v14M6 21V11M18 21V11M12 21V11M3 7l9-4 9 4"></path>
            </svg>
          </div>
          <div class="school-text">
            <span class="school-title">{{ school.name }}</span>
            <span class="school-city-sub">{{ school.city }}</span>
          </div>
        </div>
      </ng-template>

      <!-- Template Colonne Type -->
      <ng-template #cellType let-school>
        <app-type-badge [type]="school.type"></app-type-badge>
      </ng-template>

      <!-- Template Colonne Statut -->
      <ng-template #cellStatus let-school>
        <app-status-badge [status]="school.status"></app-status-badge>
      </ng-template>

      <!-- Template Colonne Actions -->
      <ng-template #cellActions let-school>
        <div class="row-actions" (click)="$event.stopPropagation()">
          <button
            class="action-btn"
            (click)="openDetail(school)"
            title="Voir le détail"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>

          @if (canManageSchools) {
            <button
              class="action-btn"
              (click)="openEditSchool(school)"
              title="Modifier l'école"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
          }

          <button
            class="action-btn"
            (click)="openDetail(school)"
            title="Plus d'options"
          >
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path d="M6 10a2 2 0 11-4 0 2 2 0 014 0zM12 10a2 2 0 11-4 0 2 2 0 014 0zM16 12a2 2 0 100-4 2 2 0 000 4z" />
            </svg>
          </button>
        </div>
      </ng-template>

      <!-- État Vide -->
      <div emptyState>
        @if (hasActiveFilters) {
          <app-empty-state
            [title]="i18n.schools.table.emptySearchResult"
            [actionLabel]="i18n.schools.filters.resetFilters"
            (action)="resetFilters()"
          ></app-empty-state>
        } @else {
          <app-empty-state
            [title]="i18n.schools.table.emptyInitial"
            [actionLabel]="canManageSchools ? i18n.schools.newSchoolBtn : undefined"
            (action)="openCreateSchool()"
          ></app-empty-state>
        }
      </div>
    </app-data-table>
  </div>

  <!-- Panneau latéral de détail -->
  <app-school-detail
    #detailComp
    [isOpen]="isDetailOpen()"
    [school]="detailSchool()"
    [activeTab]="activeDetailTab()"
    [canManageSchools]="canManageSchools"
    [canManagePrograms]="canManagePrograms"
    (closeDetail)="closeDetail()"
    (tabChange)="onDetailTabChange($event)"
    (editSchool)="openEditSchool($event)"
    (statusChange)="onSchoolStatusChange($event)"
    (addProgram)="openAddProgram()"
    (editProgram)="openEditProgram($event)"
  ></app-school-detail>

  <!-- Modale Formulaire École -->
  <app-school-form
    #schoolFormComp
    [isOpen]="isSchoolFormOpen()"
    [schoolToEdit]="schoolToEdit()"
    [loading]="submittingSchool()"
    (formSubmit)="onSaveSchool($event, schoolFormComp)"
    (formCancel)="closeSchoolForm()"
  ></app-school-form>

  <!-- Modale Formulaire Filière -->
  <app-program-form
    #progFormComp
    [isOpen]="isProgramFormOpen()"
    [programToEdit]="programToEdit()"
    [loading]="submittingProgram()"
    (formSubmit)="onSaveProgram($event, progFormComp, detailComp)"
    (formCancel)="closeProgramForm()"
  ></app-program-form>
</app-admin-layout>
